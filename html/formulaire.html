<body>

<style> 
body { 
    margin: 0; 
    font-family: 'Segoe UI', sans-serif; 
    background: #0d0d0d; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
    color: white; } 
    .container { 
        background: #111; 
        padding: 40px; 
        border-radius: 20px; 
        width: 360px; 
        box-shadow: 0 0 40px rgba(0,0,0,0.8); } /* TITRE */ 
        h2 { 
            text-align: center; 
            margin-bottom: 25px; 
            background: linear-gradient(90deg, #ffd000, #ffea00); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; } /* INPUTS */ 
            input, textarea { 
                width: 100%; 
                padding: 12px; 
                margin: 10px 0; 
                border-radius: 10px; 
                border: 1px solid #333; 
                background: transparent; 
                color: white; 
                outline: none; 
                transition: 0.3s; } 
                input:focus, textarea:focus { 
                    border-color: #ffd000; 
                    box-shadow: 0 0 10px #ffd00055; } 
                    textarea { 
                        height: 120px; } /* BOUTON ENVOI */ 
                        .btn { 
                            width: 100%; 
                            padding: 14px; 
                            border-radius: 12px; 
                            border: none; 
                            font-weight: bold; 
                            cursor: pointer; 
                            background: linear-gradient(45deg, #ffe600, #ff8800); 
                            color: #333; 
                            transition: 0.3s; 
                            margin-top: 10px; } 
                            .btn:hover { 
                                transform: scale(1.08); 
                                box-shadow: 0 0 20px #ffd000; } 
                                .btn:active { 
                                    transform: scale(0.95); } /* BOUTON REDIRECTION */ 
                                    .btn-link { 
                                        display: block; 
                                        text-align: center; 
                                        margin-top: 15px; 
                                        padding: 12px; 
                                        border-radius: 10px; 
                                        background: #222; 
                                        color: white; 
                                        text-decoration: none; 
                                        transition: 0.3s; } 
                                        .btn-link:hover { 
                                            background: #333; 
                                            transform: scale(1.05); } /* MESSAGE */ 
                                            #msg { 
                                                text-align: center; 
                                                margin-top: 10px; 
                                                color: linear-gradient(45deg, #ffe600, #ff8800);  } 
                                                </style> 
                                                </head> 
                                                <body> 
                                                    <div class="container"> 
                                                        <h2>Contact</h2> 
                                                        <form id="contact-form"> 
                                                            <input type="text" name="name" placeholder="Nom" required> 
                                                            <input type="email" name="email" placeholder="Email" required> 
                                                            <textarea name="message" placeholder="Message" required></textarea> 
                                                            <button type="submit" class="btn">Envoyer</button> 
                                                            </form> 
                                                            <div id="msg"></div> <!-- bouton vers autre page --> 
                                                            <a href="../index.html" class="btn-link">Accueil</a> 
                                                            </div> <!-- EmailJS --> 
                                                            <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script> 
                                                            <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
(function(){
  emailjs.init("miz-dHU2gJbiVHQP0"); // 🔑 ta clé
})();

document.getElementById("contact-form").addEventListener("submit", function(e) {
  e.preventDefault();

  emailjs.send("service_29lfxv7", "template_r74nnda", {
    from_name: this.name.value,
    from_email: this.email.value,
    message: this.message.value
  })
  .then(() => {
    document.getElementById("msg").innerText = "Message envoyé ✅";
    this.reset();

    setTimeout(() => {
      window.location.href = "../index.html";
    }, 2000);
  })
  .catch((error) => {
    document.getElementById("msg").innerText = "Erreur ❌";
    console.log("ERREUR:", error);
  });
});
</script>
